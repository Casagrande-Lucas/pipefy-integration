services:
  postgres:
    image: postgres:17-alpine
    container_name: pipefy_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipefy_integration}
      POSTGRES_USER: ${POSTGRES_USER:-pipefy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipefy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipefy} -d ${POSTGRES_DB:-pipefy_integration}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pipefy_pgadmin
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
